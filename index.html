<!DOCTYPE html>
<html lang="uz">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1.0"/>
<title>PyLearn — Python O'rganish</title>
<script src="https://www.google.com/recaptcha/api.js" async defer></script>
<script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
<script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
<script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
<script src="https://unpkg.com/react-router-dom@6/dist/umd/react-router-dom.production.min.js"></script>
<script src="https://unpkg.com/marked/marked.min.js"></script>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#0d0f1a;--bg2:#131629;
  --glass:rgba(255,255,255,.05);--gb:rgba(255,255,255,.10);
  --a1:#7c6dfa;--a2:#fa6d9a;--a3:#6df5c8;--a4:#fac56d;
  --text:#e8eaf6;--muted:#8892b0;
  --danger:#ff4d6d;--success:#39d98a;--warn:#ffd166;
  --r:16px;--rs:10px;
  font-family:'Segoe UI',system-ui,sans-serif;
}
body{background:var(--bg);color:var(--text);min-height:100vh;
  background-image:
    radial-gradient(ellipse at 20% 20%,rgba(124,109,250,.12) 0%,transparent 50%),
    radial-gradient(ellipse at 80% 80%,rgba(250,109,154,.10) 0%,transparent 50%)}
.glass{background:var(--glass);border:1px solid var(--gb);
  backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border-radius:var(--r)}
button{cursor:pointer;font-family:inherit;border:none;transition:all .2s}
.btn{background:linear-gradient(135deg,var(--a1),var(--a2));color:#fff;
  padding:10px 22px;border-radius:var(--rs);font-weight:600;font-size:14px}
.btn:hover{opacity:.88;transform:translateY(-1px)}
.btn-ac{background:linear-gradient(135deg,var(--a2),var(--a4));color:#fff;
  padding:10px 22px;border-radius:var(--rs);font-weight:600;font-size:14px}
.btn-ac:hover{opacity:.88;transform:translateY(-1px)}
.btn-gh{background:transparent;color:var(--muted);padding:8px 16px;
  border-radius:var(--rs);border:1px solid var(--gb);font-size:13px}
.btn-gh:hover{background:var(--glass);color:var(--text)}
.sm{padding:7px 14px;font-size:12px}
button:disabled{opacity:.45;cursor:not-allowed}
.alert{padding:12px 16px;border-radius:var(--rs);font-size:14px;margin:8px 0}
.err{background:rgba(255,77,109,.15);border:1px solid rgba(255,77,109,.3);color:#ff8fa3}
.suc{background:rgba(57,217,138,.12);border:1px solid rgba(57,217,138,.3);color:#6effc6}
.war{background:rgba(255,209,102,.12);border:1px solid rgba(255,209,102,.3);color:var(--warn)}
.inf{background:rgba(124,109,250,.12);border:1px solid rgba(124,109,250,.3);color:#b0a4ff}
.loader{display:flex;flex-direction:column;align-items:center;justify-content:center;
  min-height:60vh;gap:16px}
.spin{width:40px;height:40px;border:3px solid rgba(124,109,250,.3);
  border-top-color:var(--a1);border-radius:50%;animation:spin .7s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
/* Navbar */
.nav{display:flex;align-items:center;justify-content:space-between;
  padding:14px 24px;background:rgba(13,15,26,.85);backdrop-filter:blur(16px);
  border-bottom:1px solid var(--gb);position:sticky;top:0;z-index:100}
.nav-brand{display:flex;align-items:center;gap:8px;text-decoration:none;
  color:var(--text);font-size:18px;font-weight:700;cursor:pointer}
.grad{background:linear-gradient(135deg,var(--a1),var(--a3));
  -webkit-background-clip:text;-webkit-text-fill-color:transparent}
.nav-r{display:flex;align-items:center;gap:12px}
.pts-badge{background:rgba(124,109,250,.15);border:1px solid rgba(124,109,250,.3);
  color:var(--a1);padding:4px 12px;border-radius:20px;font-size:13px;font-weight:600}
.nav-img{width:32px;height:32px;border-radius:50%;border:2px solid var(--a1);object-fit:cover}
/* Login */
.login-page{display:flex;align-items:center;justify-content:center;
  min-height:90vh;padding:20px}
.login-card{max-width:440px;width:100%;padding:48px 40px;text-align:center;
  display:flex;flex-direction:column;align-items:center;gap:16px}
.login-logo{font-size:56px;line-height:1}
.login-title{font-size:32px;font-weight:800}
.login-sub{color:var(--muted);font-size:14px}
.cap-wrap{margin:8px 0;min-height:78px;display:flex;align-items:center;justify-content:center}
.btn-google{display:flex;align-items:center;gap:10px;background:var(--glass);
  border:1px solid var(--gb);color:var(--text);padding:12px 24px;
  border-radius:var(--rs);font-size:15px;font-weight:600;width:100%;justify-content:center}
.btn-google:hover:not(:disabled){background:rgba(255,255,255,.1);transform:translateY(-2px)}
.feats{display:flex;flex-wrap:wrap;gap:10px;justify-content:center;margin-top:8px}
.feat{background:var(--glass);border:1px solid var(--gb);padding:6px 14px;
  border-radius:20px;font-size:13px;color:var(--muted)}
/* Dashboard */
.dash{max-width:1200px;margin:0 auto;padding:24px 20px;display:flex;flex-direction:column;gap:20px}
.dash-head{padding:24px;display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:16px}
.dash-welcome{display:flex;align-items:center;gap:16px}
.dash-av{width:56px;height:56px;border-radius:50%;border:2px solid var(--a1);object-fit:cover}
.dash-stats{display:flex;gap:12px;flex-wrap:wrap}
.stat{background:rgba(255,255,255,.04);border:1px solid var(--gb);
  border-radius:var(--rs);padding:12px 20px;text-align:center;
  display:flex;flex-direction:column;gap:4px;min-width:80px}
.stat-v{font-size:22px;font-weight:800}
.stat-l{font-size:12px;color:var(--muted)}
.prog-wrap{display:flex;align-items:center;gap:12px}
.prog-bar{flex:1;height:8px;background:rgba(255,255,255,.08);border-radius:4px;overflow:hidden}
.prog-fill{height:100%;background:linear-gradient(90deg,var(--a1),var(--a3));
  border-radius:4px;transition:width .5s}
.prog-lbl{font-size:12px;color:var(--muted);white-space:nowrap}
.dash-main{display:grid;grid-template-columns:1fr 300px;gap:20px;align-items:start}
@media(max-width:900px){.dash-main{grid-template-columns:1fr}}
.sec-title{font-size:16px;font-weight:700;margin-bottom:14px}
.lessons-list{display:flex;flex-direction:column;gap:12px}
.lcard{padding:16px 20px;display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.lcard.locked{opacity:.5}.lcard.done{border-color:rgba(57,217,138,.25)}
.lday{background:rgba(124,109,250,.15);color:var(--a1);padding:3px 10px;
  border-radius:20px;font-size:11px;font-weight:700;white-space:nowrap}
.ltitle{flex:1;font-size:14px;font-weight:600;min-width:180px}
.lscore{font-size:12px;color:var(--success);font-weight:600}
.lact{display:flex;gap:8px}
.locked-lbl{font-size:12px;color:var(--muted)}
.lb{padding:20px;display:flex;flex-direction:column;gap:8px}
.lb-row{display:flex;align-items:center;gap:10px;padding:8px 10px;
  border-radius:var(--rs);transition:background .15s}
.lb-row:hover{background:rgba(255,255,255,.04)}
.lb-me{background:rgba(124,109,250,.08);border:1px solid rgba(124,109,250,.2)}
.lb-rank{font-size:18px;min-width:36px;text-align:center}
.lb-av{width:28px;height:28px;border-radius:50%;object-fit:cover}
.lb-name{flex:1;font-size:13px}
.lb-pts{font-size:12px;color:var(--a1);font-weight:700}
/* Lesson page */
.lesson-pg{max-width:820px;margin:0 auto;padding:24px 20px;display:flex;flex-direction:column;gap:16px}
.lesson-hd{padding:16px 20px;display:flex;align-items:center;gap:16px;flex-wrap:wrap}
.badge{background:rgba(124,109,250,.15);color:var(--a1);padding:3px 10px;
  border-radius:20px;font-size:11px;font-weight:700}
.lesson-hd h1{font-size:20px;font-weight:700;margin-top:4px}
.lesson-body{padding:28px;line-height:1.75;font-size:15px}
.lesson-body h1{font-size:22px;font-weight:800;margin:20px 0 10px}
.lesson-body h2{font-size:18px;color:var(--a3);margin:16px 0 8px}
.lesson-body h3{font-size:16px;margin:14px 0 6px}
.lesson-body p{color:var(--muted);margin:8px 0}
.lesson-body ul,.lesson-body ol{padding-left:20px;color:var(--muted)}
.lesson-body li{margin:4px 0}
.lesson-body strong{color:var(--text)}
.lesson-body table{width:100%;border-collapse:collapse;margin:16px 0;font-size:13px}
.lesson-body th{background:rgba(124,109,250,.15);color:var(--a1);padding:8px 12px;text-align:left}
.lesson-body td{padding:8px 12px;border-bottom:1px solid var(--gb);color:var(--muted)}
.lesson-body code{background:rgba(124,109,250,.15);color:var(--a3);
  padding:2px 7px;border-radius:5px;font-family:monospace;font-size:.9em}
.lesson-body pre{background:rgba(0,0,0,.4);border:1px solid var(--gb);
  border-radius:var(--rs);padding:16px;overflow-x:auto;margin:12px 0;line-height:1.6}
.lesson-body pre code{background:none;color:#a9b7d0;padding:0;border-radius:0}
.lesson-ft{padding:20px}
.test-cta{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
.test-cta p{color:var(--muted);font-size:14px}
/* Test page */
.test-pg{max-width:700px;margin:0 auto;padding:20px;display:flex;flex-direction:column;gap:16px}
.test-top{padding:14px 20px;display:flex;align-items:center;justify-content:space-between}
.test-prog{font-size:14px;color:var(--muted);font-weight:600}
.gtime{font-size:20px;font-weight:800;color:var(--a3);font-variant-numeric:tabular-nums}
.gtime.danger{color:var(--danger);animation:pulse 1s infinite}
.tbar-w{height:6px;background:rgba(255,255,255,.08);border-radius:3px;overflow:hidden}
.tbar{height:100%;background:linear-gradient(90deg,var(--a1),var(--a3));
  border-radius:3px;transition:width .9s linear}
.tbar.red,.qtbar.red{background:linear-gradient(90deg,#ff4d6d,#ff8c42)}
.qcard{padding:28px;display:flex;flex-direction:column;gap:16px}
.qhd{display:flex;align-items:center;justify-content:space-between}
.qnum{background:rgba(124,109,250,.15);color:var(--a1);padding:3px 10px;
  border-radius:20px;font-size:12px;font-weight:700}
.qtimer{font-size:16px;font-weight:800;color:var(--a3)}
.qtimer.danger{color:var(--danger);animation:pulse 1s infinite}
.qtbar-w{height:4px;background:rgba(255,255,255,.06);border-radius:2px;overflow:hidden}
.qtbar{height:100%;background:linear-gradient(90deg,var(--a3),var(--a1));
  border-radius:2px;transition:width .9s linear}
.qtext{font-size:17px;font-weight:600;line-height:1.55;white-space:pre-wrap}
.opts{display:flex;flex-direction:column;gap:10px}
.opt{display:flex;align-items:center;gap:14px;background:rgba(255,255,255,.04);
  border:1px solid var(--gb);color:var(--text);padding:14px 18px;
  border-radius:var(--rs);text-align:left;font-size:14px;transition:all .18s}
.opt:hover:not(:disabled){background:rgba(124,109,250,.1);border-color:rgba(124,109,250,.4);
  transform:translateX(4px)}
.opt.sel{background:rgba(124,109,250,.2);border-color:var(--a1);color:#fff}
.opt.faded{opacity:.4}
.opt-l{width:28px;height:28px;display:flex;align-items:center;justify-content:center;
  background:rgba(124,109,250,.2);border-radius:7px;font-size:12px;font-weight:800;
  color:var(--a1);flex-shrink:0}
.opt.sel .opt-l{background:var(--a1);color:#fff}
/* Test ready */
.test-ready{max-width:700px;margin:0 auto;padding:40px 20px}
.intro{padding:36px;display:flex;flex-direction:column;gap:16px}
.intro h2{font-size:22px;font-weight:700}
.rules{list-style:none;display:flex;flex-direction:column;gap:10px}
.rules li{font-size:14px;color:var(--muted);padding:10px 14px;
  background:rgba(255,255,255,.03);border-radius:var(--rs)}
/* Result */
.result-pg{min-height:80vh;display:flex;align-items:center;justify-content:center;padding:20px}
.res-card{padding:40px;max-width:460px;width:100%;text-align:center;
  display:flex;flex-direction:column;align-items:center;gap:16px}
.res-emoji{font-size:56px}
.res-title{font-size:24px;font-weight:800}
.res-ring{width:120px;height:120px;border-radius:50%;
  background:conic-gradient(var(--a1) var(--p,0%),rgba(255,255,255,.08) 0);
  display:flex;align-items:center;justify-content:center;position:relative}
.res-ring::before{content:'';position:absolute;inset:10px;
  background:var(--bg2);border-radius:50%}
.res-num{position:relative;font-size:26px;font-weight:800}
.res-stats{display:flex;gap:20px}
.res-stat{display:flex;flex-direction:column;align-items:center;gap:4px}
.res-stat span{font-size:12px;color:var(--muted)}
.res-stat strong{font-size:20px;font-weight:800}
/* Banned */
.banned-pg{display:flex;align-items:center;justify-content:center;
  min-height:90vh;padding:20px}
.banned-card{max-width:440px;width:100%;padding:48px 40px;text-align:center;
  display:flex;flex-direction:column;align-items:center;gap:16px}
.banned-icon{font-size:64px}
.ban-title{font-size:26px;font-weight:800;color:var(--danger)}
.ban-reason{font-size:15px;padding:12px 16px;
  background:rgba(255,77,109,.1);border-radius:var(--rs);width:100%}
.ban-info{font-size:13px;color:var(--muted);line-height:1.6}
/* Page wrap */
.pw{max-width:720px;margin:40px auto;padding:0 20px;display:flex;flex-direction:column;gap:16px}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.5}}
::-webkit-scrollbar{width:6px}
::-webkit-scrollbar-thumb{background:rgba(124,109,250,.3);border-radius:3px}
</style>
</head>
<body>
<div id="root"></div>

<script type="text/babel" data-presets="react">
// ── Config ────────────────────────────────────────────────────────────────
const API_URL = "https://GrogramUz.pythonanywhere.com/api";
const RECAPTCHA_SITE_KEY = "6LeGDa4sAAAAAGBtobleQY1SZpDnWp-V0TBlTeyo";

// ── Router ────────────────────────────────────────────────────────────────
const { BrowserRouter, Routes, Route, Navigate, useNavigate, useParams } = ReactRouterDOM;
const { useState, useEffect, useRef, useCallback, createContext, useContext } = React;

// ── API helper ─────────────────────────────────────────────────────────────
async function api(method, path, body) {
  const token = localStorage.getItem("token");
  const res = await fetch(`${API_URL}${path}`, {
    method,
    headers: {
      "Content-Type": "application/json",
      ...(token ? { Authorization: `Bearer ${token}` } : {}),
    },
    credentials: "include",
    ...(body ? { body: JSON.stringify(body) } : {}),
  });
  if (res.status === 401) {
    localStorage.removeItem("token");
    window.location.href = "/";
    return;
  }
  const data = await res.json();
  if (!res.ok) throw data;
  return data;
}

// ── Auth Context ──────────────────────────────────────────────────────────
const AuthCtx = createContext(null);
function AuthProvider({ children }) {
  const [user, setUser] = useState(null);
  const [loading, setLoading] = useState(true);

  const fetchMe = useCallback(async () => {
    try {
      const data = await api("GET", "/auth/me");
      setUser(data);
    } catch {
      localStorage.removeItem("token");
      setUser(null);
    } finally {
      setLoading(false);
    }
  }, []);

  useEffect(() => {
    if (localStorage.getItem("token")) fetchMe();
    else setLoading(false);
  }, []);

  const login = (token) => {
    localStorage.setItem("token", token);
    fetchMe();
  };
  const logout = () => {
    localStorage.removeItem("token");
    setUser(null);
  };

  return (
    <AuthCtx.Provider value={{ user, loading, login, logout, fetchMe }}>
      {children}
    </AuthCtx.Provider>
  );
}
const useAuth = () => useContext(AuthCtx);

// ── Private Route ─────────────────────────────────────────────────────────
function PrivateRoute({ children }) {
  const { user, loading } = useAuth();
  if (loading) return <Loader />;
  if (!user) return <Navigate to="/" replace />;
  if (user.is_banned) return <Navigate to="/banned" replace />;
  return children;
}

// ── Loader ────────────────────────────────────────────────────────────────
function Loader() {
  return <div className="loader"><div className="spin" /></div>;
}

// ── Navbar ────────────────────────────────────────────────────────────────
function Navbar() {
  const { user, logout } = useAuth();
  const nav = useNavigate();
  if (!user) return null;
  return (
    <nav className="nav">
      <div className="nav-brand" onClick={() => nav("/dashboard")}>
        🐍 <span className="grad">PyLearn</span>
      </div>
      <div className="nav-r">
        <div className="pts-badge">⚡ {user.points} ball</div>
        {user.avatar && <img className="nav-img" src={user.avatar} alt={user.name} />}
        <span style={{fontSize:13,color:"var(--muted)"}}>{user.name.split(" ")[0]}</span>
        <button className="btn-gh" onClick={() => { logout(); nav("/"); }}>Chiqish</button>
      </div>
    </nav>
  );
}

// ════════════════════════════════════════════════════════════════
//  PAGE: LOGIN
// ════════════════════════════════════════════════════════════════
function LoginPage() {
  const { user, login } = useAuth();
  const nav = useNavigate();
  const capRef = useRef(null);
  const [error, setError] = useState("");
  const [captchaDone, setCaptchaDone] = useState(false);
  const [captchaToken, setCaptchaToken] = useState("");
  const [loading, setLoading] = useState(false);

  useEffect(() => {
    if (user) nav("/dashboard");
    const params = new URLSearchParams(window.location.search);
    if (params.get("error") === "captcha_required") setError("CAPTCHA tasdiqlash talab qilinadi.");
    if (params.get("error") === "auth_failed") setError("Google orqali kirish muvaffaqiyatsiz.");
  }, [user]);

  useEffect(() => {
    const interval = setInterval(() => {
      if (window.grecaptcha && capRef.current && !capRef.current.dataset.rendered) {
        capRef.current.dataset.rendered = "1";
        window.grecaptcha.render(capRef.current, {
          sitekey: RECAPTCHA_SITE_KEY,
          callback: onCap,
          "expired-callback": () => { setCaptchaDone(false); setCaptchaToken(""); },
        });
        clearInterval(interval);
      }
    }, 300);
    return () => clearInterval(interval);
  }, []);

  async function onCap(token) {
    try {
      const data = await api("POST", "/auth/verify-captcha", { token });
      if (data.success) { setCaptchaDone(true); setCaptchaToken(data.captcha_token); }
    } catch { setError("CAPTCHA xato."); }
  }

  function handleLogin() {
    if (!captchaDone || !captchaToken) { setError("Avval CAPTCHAni tasdiqlang."); return; }
    setLoading(true);
    window.location.href = `${API_URL}/auth/google?captcha_token=${encodeURIComponent(captchaToken)}`;
  }

  return (
    <div className="login-page">
      <div className="login-card glass">
        <div className="login-logo">🐍</div>
        <h1 className="login-title grad">PyLearn</h1>
        <p className="login-sub">Python dasturlashni o'rganing — har kuni bir qadam</p>
        {error && <div className="alert err">{error}</div>}
        <div className="cap-wrap"><div ref={capRef} /></div>
        <button className="btn-google" onClick={handleLogin} disabled={!captchaDone || loading}>
          {loading
            ? <span className="spin" style={{width:18,height:18,borderWidth:2}} />
            : <>
                <svg width="20" height="20" viewBox="0 0 48 48">
                  <path fill="#FFC107" d="M43.6 20.1H42V20H24v8h11.3C33.7 32.7 29.2 36 24 36c-6.6 0-12-5.4-12-12s5.4-12 12-12c3.1 0 5.8 1.1 7.9 3l5.7-5.7C34.5 6.5 29.5 4 24 4 12.9 4 4 12.9 4 24s8.9 20 20 20 20-8.9 20-20c0-1.3-.1-2.6-.4-3.9z"/>
                  <path fill="#FF3D00" d="m6.3 14.7 6.6 4.8C14.7 16 19 13 24 13c3.1 0 5.8 1.1 7.9 3l5.7-5.7C34.5 6.5 29.5 4 24 4 16.3 4 9.7 8.3 6.3 14.7z"/>
                  <path fill="#4CAF50" d="M24 44c5.2 0 9.9-2 13.4-5.2l-6.2-5.2C29.4 35.5 26.8 36 24 36c-5.2 0-9.6-3.3-11.3-8H6.4C9.8 35.7 16.3 44 24 44z"/>
                  <path fill="#1976D2" d="M43.6 20.1H42V20H24v8h11.3c-.8 2.3-2.4 4.3-4.4 5.6l6.2 5.2C41.5 36.2 44 30.6 44 24c0-1.3-.1-2.6-.4-3.9z"/>
                </svg>
                Google orqali kirish
              </>
          }
        </button>
        <div className="feats">
          <div className="feat">📚 Har kuni yangi dars</div>
          <div className="feat">⏱️ Vaqtli testlar</div>
          <div className="feat">🏆 Reyting tizimi</div>
        </div>
      </div>
    </div>
  );
}

// ════════════════════════════════════════════════════════════════
//  PAGE: AUTH CALLBACK
// ════════════════════════════════════════════════════════════════
function AuthCallback() {
  const { login } = useAuth();
  const nav = useNavigate();
  useEffect(() => {
    const token = new URLSearchParams(window.location.search).get("token");
    if (token) { login(token); setTimeout(() => nav("/dashboard"), 600); }
    else nav("/?error=auth_failed");
  }, []);
  return <Loader />;
}

// ════════════════════════════════════════════════════════════════
//  PAGE: DASHBOARD
// ════════════════════════════════════════════════════════════════
function Dashboard() {
  const { user, fetchMe } = useAuth();
  const nav = useNavigate();
  const [lessons, setLessons] = useState([]);
  const [lb, setLb] = useState([]);
  const [loading, setLoading] = useState(true);

  useEffect(() => {
    Promise.all([api("GET","/lessons/"), api("GET","/user/leaderboard")])
      .then(([l, r]) => { setLessons(l); setLb(r); })
      .catch(console.error)
      .finally(() => { setLoading(false); fetchMe(); });
  }, []);

  if (loading) return <Loader />;

  const done = lessons.filter(l => l.is_completed).length;
  const pct  = lessons.length ? Math.round(done/lessons.length*100) : 0;

  return (
    <div className="dash">
      <div className="dash-head glass">
        <div className="dash-welcome">
          {user.avatar && <img className="dash-av" src={user.avatar} alt={user.name} />}
          <div>
            <h2 style={{fontSize:20,fontWeight:700}}>Salom, {user.name.split(" ")[0]}! 👋</h2>
            <p style={{color:"var(--muted)",fontSize:13}}>{user.email}</p>
          </div>
        </div>
        <div className="dash-stats">
          <div className="stat"><span className="stat-v grad">{user.points}</span><span className="stat-l">⚡ Ball</span></div>
          <div className="stat"><span className="stat-v grad">{done}</span><span className="stat-l">📚 Dars</span></div>
          <div className="stat"><span className="stat-v grad">{pct}%</span><span className="stat-l">📈 Progress</span></div>
        </div>
      </div>

      <div className="prog-wrap">
        <div className="prog-bar"><div className="prog-fill" style={{width:`${pct}%`}} /></div>
        <span className="prog-lbl">{done} / {lessons.length} dars</span>
      </div>

      <div className="dash-main">
        <div>
          <div className="sec-title">📚 Darslar</div>
          <div className="lessons-list">
            {lessons.map(l => (
              <div key={l.id} className={`lcard glass ${!l.is_unlocked?"locked":""} ${l.is_completed?"done":""}`}>
                <div className="lday">Kun {l.day_number}</div>
                <div className="ltitle">{l.title}</div>
                {l.is_completed && <div className="lscore">✅ {l.score}%</div>}
                <div className="lact">
                  {l.is_unlocked ? <>
                    <button className="btn sm" onClick={() => nav(`/lesson/${l.id}`)}>📖 O'qish</button>
                    {!l.is_completed && <button className="btn-ac sm" onClick={() => nav(`/test/${l.id}`)}>🎯 Test</button>}
                  </> : <span className="locked-lbl">🔒 Qulflangan</span>}
                </div>
              </div>
            ))}
          </div>
        </div>

        <div className="lb glass">
          <div className="sec-title">🏆 Reyting</div>
          {lb.map(u => (
            <div key={u.rank} className={`lb-row ${user.email===u.email?"lb-me":""}`}>
              <span className="lb-rank">{u.rank===1?"🥇":u.rank===2?"🥈":u.rank===3?"🥉":`#${u.rank}`}</span>
              {u.avatar && <img className="lb-av" src={u.avatar} alt={u.name} />}
              <span className="lb-name">{u.name}</span>
              <span className="lb-pts">⚡{u.points}</span>
            </div>
          ))}
        </div>
      </div>
    </div>
  );
}

// ════════════════════════════════════════════════════════════════
//  PAGE: LESSON
// ════════════════════════════════════════════════════════════════
function LessonPage() {
  const { id } = useParams();
  const nav = useNavigate();
  const [lesson, setLesson] = useState(null);
  const [status, setStatus] = useState(null);
  const [error, setError] = useState("");

  useEffect(() => {
    Promise.all([api("GET",`/lessons/${id}`), api("GET",`/tests/status/${id}`)])
      .then(([l, s]) => { setLesson(l); setStatus(s); })
      .catch(e => setError(e.message || "Dars yuklanmadi"));
  }, [id]);

  if (error) return <div className="pw"><div className="alert err">{error}</div><button className="btn" onClick={() => nav("/dashboard")}>← Orqaga</button></div>;
  if (!lesson) return <Loader />;

  // Markdown render (marked.js orqali)
  const html = marked.parse(lesson.content || "");

  return (
    <div className="lesson-pg">
      <div className="lesson-hd glass">
        <button className="btn-gh" onClick={() => nav("/dashboard")}>← Orqaga</button>
        <div>
          <span className="badge">Kun {lesson.day_number}</span>
          <h1>{lesson.title}</h1>
        </div>
      </div>

      <div className="lesson-body glass" dangerouslySetInnerHTML={{__html:html}} />

      <div className="lesson-ft glass">
        {status?.is_completed
          ? <div className="alert suc">✅ Test muvaffaqiyatli topshirildi! Ball: {status.attempt?.score}%</div>
          : status?.can_start
            ? <div className="test-cta">
                <p>Darsni o'qib chiqdingizmi? Testga o'ting!</p>
                <button className="btn-ac" onClick={() => nav(`/test/${lesson.id}`)}>🎯 Testni boshlash</button>
              </div>
            : status?.has_open_attempt
              ? <div className="test-cta">
                  <p>⚠️ Ochiq urinish mavjud!</p>
                  <button className="btn-ac" onClick={() => nav(`/test/${lesson.id}`)}>▶️ Davom ettirish</button>
                </div>
              : <div className="alert inf">ℹ️ Test hali ochilmagan yoki allaqachon topshirilgan.</div>
        }
      </div>
    </div>
  );
}

// ════════════════════════════════════════════════════════════════
//  PAGE: TEST
// ════════════════════════════════════════════════════════════════
function TestPage() {
  const { lessonId } = useParams();
  const nav = useNavigate();
  const { fetchMe } = useAuth();

  const [stage, setStage]       = useState("loading");
  const [attemptId, setAttemptId] = useState(null);
  const [questions, setQuestions] = useState([]);
  const [idx, setIdx]           = useState(0);
  const [answers, setAnswers]   = useState({});
  const [selected, setSelected] = useState(null);
  const [gTime, setGTime]       = useState(180);
  const [qTime, setQTime]       = useState(30);
  const [result, setResult]     = useState(null);
  const [error, setError]       = useState("");
  const [submitting, setSubmitting] = useState(false);

  const gRef = useRef(null);
  const qRef = useRef(null);
  const autoDone = useRef(false);
  const answersRef = useRef({});

  useEffect(() => {
    api("GET",`/tests/status/${lessonId}`)
      .then(s => {
        if (s.is_completed) { setResult(s.attempt); setStage("result"); }
        else if (s.has_open_attempt || s.can_start) setStage("ready");
        else { setError("Bu testni boshlab bo'lmaydi."); setStage("error"); }
      })
      .catch(() => { setError("Xatolik yuz berdi."); setStage("error"); });
  }, [lessonId]);

  async function startTest() {
    setStage("loading");
    try {
      const d = await api("POST",`/tests/start/${lessonId}`);
      setAttemptId(d.attempt_id);
      setQuestions(d.questions);
      setGTime(d.remaining_seconds);
      setQTime(d.questions[0]?.time_limit_seconds || 30);
      setStage("active");
    } catch(e) {
      if (e.error === "banned") nav("/banned");
      else { setError(e.message || "Test boshlanmadi"); setStage("error"); }
    }
  }

  // Global timer
  useEffect(() => {
    if (stage !== "active") return;
    gRef.current = setInterval(() => {
      setGTime(prev => {
        if (prev <= 1) {
          clearInterval(gRef.current);
          if (!autoDone.current) { autoDone.current = true; doSubmit(true); }
          return 0;
        }
        return prev - 1;
      });
    }, 1000);
    return () => clearInterval(gRef.current);
  }, [stage]);

  // Question timer
  useEffect(() => {
    if (stage !== "active") return;
    clearInterval(qRef.current);
    const q = questions[idx];
    if (!q) return;
    setQTime(q.time_limit_seconds);
    qRef.current = setInterval(() => {
      setQTime(prev => {
        if (prev <= 1) {
          clearInterval(qRef.current);
          nextQuestion(true);
          return 0;
        }
        return prev - 1;
      });
    }, 1000);
    return () => clearInterval(qRef.current);
  }, [idx, stage]);

  function handleSelect(i) {
    if (selected !== null) return;
    setSelected(i);
    const newAns = { ...answersRef.current, [questions[idx].id]: i };
    answersRef.current = newAns;
    setAnswers(newAns);
  }

  function nextQuestion(timedOut = false) {
    clearInterval(qRef.current);
    setSelected(null);
    if (idx + 1 >= questions.length) {
      if (!autoDone.current) { autoDone.current = true; doSubmit(timedOut && gTime <= 0); }
    } else {
      setIdx(i => i + 1);
    }
  }

  const doSubmit = useCallback(async (isTimeout = false) => {
    if (submitting) return;
    setSubmitting(true);
    clearInterval(gRef.current); clearInterval(qRef.current);
    try {
      const d = await api("POST",`/tests/submit/${attemptId}`,
        { answers: answersRef.current, is_timed_out: isTimeout });
      setResult(d); setStage("result"); fetchMe();
    } catch(e) {
      if (e.error === "banned") nav("/banned");
      else { setError(e.message || "Topshirishda xato"); setStage("error"); }
    } finally { setSubmitting(false); }
  }, [attemptId, submitting]);

  function fmt(s) {
    return `${String(Math.floor(s/60)).padStart(2,"0")}:${String(s%60).padStart(2,"0")}`;
  }

  if (stage === "loading") return <Loader />;
  if (stage === "error") return <div className="pw"><div className="alert err">{error}</div><button className="btn" onClick={() => nav("/dashboard")}>← Orqaga</button></div>;
  if (stage === "result") return <ResultScreen result={result} nav={nav} />;

  if (stage === "ready") return (
    <div className="test-ready">
      <div className="intro glass">
        <h2>🎯 Test qoidalari</h2>
        <ul className="rules">
          <li>⏱️ Umumiy vaqt: <strong>3 daqiqa</strong></li>
          <li>❓ Har savol uchun alohida vaqt bor</li>
          <li>🔴 Vaqt tugasa, test avtomatik topshiriladi</li>
          <li>🚫 3 daqiqadan oshsangiz — akkount ban qilinadi</li>
          <li>📅 Kuniga faqat 1 ta test</li>
        </ul>
        <button className="btn-ac" onClick={startTest}>▶️ Testni boshlash</button>
      </div>
    </div>
  );

  const q = questions[idx];
  const gPct = (gTime / 180) * 100;
  const qPct = (qTime / (q?.time_limit_seconds || 30)) * 100;

  return (
    <div className="test-pg">
      <div className="test-top glass">
        <div className="test-prog">Savol {idx+1} / {questions.length}</div>
        <div className={`gtime ${gTime<=30?"danger":""}`}>⏱️ {fmt(gTime)}</div>
      </div>
      <div className="tbar-w"><div className={`tbar ${gTime<=30?"red":""}`} style={{width:`${gPct}%`}} /></div>

      <div className="qcard glass">
        <div className="qhd">
          <span className="qnum">#{idx+1}</span>
          <div className={`qtimer ${qTime<=10?"danger":""}`}>🕐 {qTime}s</div>
        </div>
        <div className="qtbar-w"><div className={`qtbar ${qTime<=10?"red":""}`} style={{width:`${qPct}%`}} /></div>
        <p className="qtext">{q.question_text}</p>
        <div className="opts">
          {q.options.map((opt, i) => (
            <button key={i}
              className={`opt ${selected===i?"sel":""} ${selected!==null&&i!==selected?"faded":""}`}
              onClick={() => handleSelect(i)}
              disabled={selected !== null}>
              <span className="opt-l">{["A","B","C","D"][i]}</span>
              <span>{opt}</span>
            </button>
          ))}
        </div>
        {selected !== null && (
          <button className="btn-ac" style={{alignSelf:"flex-end",marginTop:8}}
            onClick={() => nextQuestion(false)}>
            {idx+1===questions.length ? "✅ Testni tugatish" : "Keyingi savol →"}
          </button>
        )}
      </div>
    </div>
  );
}

function ResultScreen({ result, nav }) {
  const pct = result?.score ?? 0;
  const pass = pct >= 60;
  const style = { "--p": `${pct}%` };
  return (
    <div className="result-pg">
      <div className="res-card glass">
        <div className="res-emoji">{pass ? "🎉" : "😔"}</div>
        <h2 className="res-title">{pass ? "Tabriklaymiz!" : "Keyingi safar urinib ko'ring"}</h2>
        <div className="res-ring" style={style}>
          <span className="res-num">{pct}%</span>
        </div>
        <div className="res-stats">
          <div className="res-stat"><span>✅ To'g'ri</span><strong>{result.correct_answers_count ?? result.correct_count ?? 0}</strong></div>
          <div className="res-stat"><span>❓ Jami</span><strong>{result.total_questions}</strong></div>
          {result.points_earned != null && <div className="res-stat"><span>⚡ Ball</span><strong>+{result.points_earned}</strong></div>}
        </div>
        {result.is_timed_out && <div className="alert war">⚠️ Vaqt tugaganligi sababli avtomatik topshirildi.</div>}
        <button className="btn" onClick={() => nav("/dashboard")}>🏠 Bosh sahifaga</button>
      </div>
    </div>
  );
}

// ════════════════════════════════════════════════════════════════
//  PAGE: BANNED
// ════════════════════════════════════════════════════════════════
function BannedPage() {
  const { user, logout } = useAuth();
  const nav = useNavigate();
  return (
    <div className="banned-pg">
      <div className="banned-card glass">
        <div className="banned-icon">🚫</div>
        <h1 className="ban-title">Akkount bloklandi</h1>
        <p className="ban-reason">{user?.ban_reason || "Qoidalar buzildi"}</p>
        <p className="ban-info">Administrator bilan bog'laning.</p>
        <button className="btn-gh" onClick={() => { logout(); nav("/"); }}>Chiqish</button>
      </div>
    </div>
  );
}

// ════════════════════════════════════════════════════════════════
//  APP
// ════════════════════════════════════════════════════════════════
function App() {
  const { loading } = useAuth();
  if (loading) return <Loader />;
  return (
    <>
      <Navbar />
      <Routes>
        <Route path="/" element={<LoginPage />} />
        <Route path="/auth/callback" element={<AuthCallback />} />
        <Route path="/banned" element={<BannedPage />} />
        <Route path="/dashboard" element={<PrivateRoute><Dashboard /></PrivateRoute>} />
        <Route path="/lesson/:id" element={<PrivateRoute><LessonPage /></PrivateRoute>} />
        <Route path="/test/:lessonId" element={<PrivateRoute><TestPage /></PrivateRoute>} />
        <Route path="*" element={<Navigate to="/" replace />} />
      </Routes>
    </>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(
  <BrowserRouter>
    <AuthProvider>
      <App />
    </AuthProvider>
  </BrowserRouter>
);
</script>
