<!DOCTYPE html>
<html lang="uz">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1.0"/>
<title>PyLearn — Python O'rganish</title>
<script src="https://www.google.com/recaptcha/api.js" async defer></script>
<script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#0d0f1a;--bg2:#131629;
  --glass:rgba(255,255,255,.05);--gb:rgba(255,255,255,.10);
  --a1:#7c6dfa;--a2:#fa6d9a;--a3:#6df5c8;--a4:#fac56d;
  --text:#e8eaf6;--muted:#8892b0;
  --danger:#ff4d6d;--success:#39d98a;--warn:#ffd166;
  --r:16px;--rs:10px;
  font-family:'Segoe UI',system-ui,sans-serif;
}
body{background:var(--bg);color:var(--text);min-height:100vh;
  background-image:
    radial-gradient(ellipse at 20% 20%,rgba(124,109,250,.12) 0%,transparent 50%),
    radial-gradient(ellipse at 80% 80%,rgba(250,109,154,.10) 0%,transparent 50%)}
.glass{background:var(--glass);border:1px solid var(--gb);backdrop-filter:blur(12px);border-radius:var(--r)}
button{cursor:pointer;font-family:inherit;border:none;transition:all .2s}
.btn{background:linear-gradient(135deg,var(--a1),var(--a2));color:#fff;padding:10px 22px;border-radius:var(--rs);font-weight:600;font-size:14px}
.btn:hover{opacity:.88;transform:translateY(-1px)}
.btn-ac{background:linear-gradient(135deg,var(--a2),var(--a4));color:#fff;padding:10px 22px;border-radius:var(--rs);font-weight:600;font-size:14px}
.btn-ac:hover{opacity:.88;transform:translateY(-1px)}
.btn-gh{background:transparent;color:var(--muted);padding:8px 16px;border-radius:var(--rs);border:1px solid var(--gb);font-size:13px}
.btn-gh:hover{background:var(--glass);color:var(--text)}
.sm{padding:7px 14px!important;font-size:12px!important}
button:disabled{opacity:.45;cursor:not-allowed}
.alert{padding:12px 16px;border-radius:var(--rs);font-size:14px;margin:8px 0}
.err{background:rgba(255,77,109,.15);border:1px solid rgba(255,77,109,.3);color:#ff8fa3}
.suc{background:rgba(57,217,138,.12);border:1px solid rgba(57,217,138,.3);color:#6effc6}
.war{background:rgba(255,209,102,.12);border:1px solid rgba(255,209,102,.3);color:var(--warn)}
.inf{background:rgba(124,109,250,.12);border:1px solid rgba(124,109,250,.3);color:#b0a4ff}
.loader{display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:70vh;gap:16px}
.spin{width:44px;height:44px;border:3px solid rgba(124,109,250,.3);border-top-color:var(--a1);border-radius:50%;animation:spin .7s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.nav{display:flex;align-items:center;justify-content:space-between;padding:14px 24px;background:rgba(13,15,26,.9);backdrop-filter:blur(16px);border-bottom:1px solid var(--gb);position:sticky;top:0;z-index:100}
.nav-brand{display:flex;align-items:center;gap:8px;font-size:18px;font-weight:700;cursor:pointer}
.grad{background:linear-gradient(135deg,var(--a1),var(--a3));-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text}
.nav-r{display:flex;align-items:center;gap:12px}
.pts-badge{background:rgba(124,109,250,.15);border:1px solid rgba(124,109,250,.3);color:var(--a1);padding:4px 12px;border-radius:20px;font-size:13px;font-weight:600}
.nav-img{width:32px;height:32px;border-radius:50%;border:2px solid var(--a1);object-fit:cover}
.login-page{display:flex;align-items:center;justify-content:center;min-height:90vh;padding:20px}
.login-card{max-width:440px;width:100%;padding:48px 40px;text-align:center;display:flex;flex-direction:column;align-items:center;gap:16px}
.login-logo{font-size:56px;line-height:1}
.login-title{font-size:32px;font-weight:800}
.login-sub{color:var(--muted);font-size:14px}
.cap-wrap{margin:8px 0;min-height:78px;display:flex;align-items:center;justify-content:center}
.btn-google{display:flex;align-items:center;gap:10px;background:var(--glass);border:1px solid var(--gb);color:var(--text);padding:12px 24px;border-radius:var(--rs);font-size:15px;font-weight:600;width:100%;justify-content:center}
.btn-google:hover:not(:disabled){background:rgba(255,255,255,.1);transform:translateY(-2px)}
.feats{display:flex;flex-wrap:wrap;gap:10px;justify-content:center;margin-top:8px}
.feat{background:var(--glass);border:1px solid var(--gb);padding:6px 14px;border-radius:20px;font-size:13px;color:var(--muted)}
.dash{max-width:1200px;margin:0 auto;padding:24px 20px;display:flex;flex-direction:column;gap:20px}
.dash-head{padding:24px;display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:16px}
.dash-welcome{display:flex;align-items:center;gap:16px}
.dash-av{width:56px;height:56px;border-radius:50%;border:2px solid var(--a1);object-fit:cover}
.dash-stats{display:flex;gap:12px;flex-wrap:wrap}
.stat{background:rgba(255,255,255,.04);border:1px solid var(--gb);border-radius:var(--rs);padding:12px 20px;text-align:center;display:flex;flex-direction:column;gap:4px;min-width:80px}
.stat-v{font-size:22px;font-weight:800}
.stat-l{font-size:12px;color:var(--muted)}
.prog-wrap{display:flex;align-items:center;gap:12px}
.prog-bar{flex:1;height:8px;background:rgba(255,255,255,.08);border-radius:4px;overflow:hidden}
.prog-fill{height:100%;background:linear-gradient(90deg,var(--a1),var(--a3));border-radius:4px;transition:width .5s}
.prog-lbl{font-size:12px;color:var(--muted);white-space:nowrap}
.dash-main{display:grid;grid-template-columns:1fr 300px;gap:20px;align-items:start}
@media(max-width:900px){.dash-main{grid-template-columns:1fr}}
.sec-title{font-size:16px;font-weight:700;margin-bottom:14px}
.lessons-list{display:flex;flex-direction:column;gap:12px}
.lcard{padding:16px 20px;display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.lcard.locked{opacity:.5}.lcard.done{border-color:rgba(57,217,138,.25)}
.lday{background:rgba(124,109,250,.15);color:var(--a1);padding:3px 10px;border-radius:20px;font-size:11px;font-weight:700;white-space:nowrap}
.ltitle{flex:1;font-size:14px;font-weight:600;min-width:180px}
.lscore{font-size:12px;color:var(--success);font-weight:600}
.lact{display:flex;gap:8px}
.lb{padding:20px;display:flex;flex-direction:column;gap:8px}
.lb-row{display:flex;align-items:center;gap:10px;padding:8px 10px;border-radius:var(--rs)}
.lb-row:hover{background:rgba(255,255,255,.04)}
.lb-me{background:rgba(124,109,250,.08);border:1px solid rgba(124,109,250,.2)}
.lb-rank{font-size:18px;min-width:36px;text-align:center}
.lb-av{width:28px;height:28px;border-radius:50%;object-fit:cover}
.lb-name{flex:1;font-size:13px}
.lb-pts{font-size:12px;color:var(--a1);font-weight:700}
.lesson-pg{max-width:820px;margin:0 auto;padding:24px 20px;display:flex;flex-direction:column;gap:16px}
.lesson-hd{padding:16px 20px;display:flex;align-items:center;gap:16px;flex-wrap:wrap}
.badge{background:rgba(124,109,250,.15);color:var(--a1);padding:3px 10px;border-radius:20px;font-size:11px;font-weight:700}
.lesson-body{padding:28px;line-height:1.75;font-size:15px}
.lesson-body h1{font-size:22px;font-weight:800;margin:20px 0 10px}
.lesson-body h2{font-size:18px;color:var(--a3);margin:16px 0 8px}
.lesson-body p{color:var(--muted);margin:8px 0}
.lesson-body ul,.lesson-body ol{padding-left:20px;color:var(--muted)}
.lesson-body li{margin:4px 0}
.lesson-body strong{color:var(--text)}
.lesson-body table{width:100%;border-collapse:collapse;margin:16px 0;font-size:13px}
.lesson-body th{background:rgba(124,109,250,.15);color:var(--a1);padding:8px 12px;text-align:left}
.lesson-body td{padding:8px 12px;border-bottom:1px solid var(--gb);color:var(--muted)}
.lesson-body code{background:rgba(124,109,250,.15);color:var(--a3);padding:2px 7px;border-radius:5px;font-family:monospace;font-size:.9em}
.lesson-body pre{background:rgba(0,0,0,.4);border:1px solid var(--gb);border-radius:var(--rs);padding:16px;overflow-x:auto;margin:12px 0;line-height:1.6}
.lesson-body pre code{background:none;color:#a9b7d0;padding:0}
.lesson-ft{padding:20px}
.test-cta{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
.test-cta p{color:var(--muted);font-size:14px}
.test-pg{max-width:700px;margin:0 auto;padding:20px;display:flex;flex-direction:column;gap:16px}
.test-top{padding:14px 20px;display:flex;align-items:center;justify-content:space-between}
.gtime{font-size:20px;font-weight:800;color:var(--a3);font-variant-numeric:tabular-nums}
.gtime.danger{color:var(--danger);animation:pulse 1s infinite}
.tbar-w{height:6px;background:rgba(255,255,255,.08);border-radius:3px;overflow:hidden}
.tbar{height:100%;background:linear-gradient(90deg,var(--a1),var(--a3));border-radius:3px;transition:width .9s linear}
.tbar.red,.qtbar.red{background:linear-gradient(90deg,#ff4d6d,#ff8c42)}
.qcard{padding:28px;display:flex;flex-direction:column;gap:16px}
.qhd{display:flex;align-items:center;justify-content:space-between}
.qnum{background:rgba(124,109,250,.15);color:var(--a1);padding:3px 10px;border-radius:20px;font-size:12px;font-weight:700}
.qtimer{font-size:16px;font-weight:800;color:var(--a3)}
.qtimer.danger{color:var(--danger);animation:pulse 1s infinite}
.qtbar-w{height:4px;background:rgba(255,255,255,.06);border-radius:2px;overflow:hidden}
.qtbar{height:100%;background:linear-gradient(90deg,var(--a3),var(--a1));border-radius:2px;transition:width .9s linear}
.qtext{font-size:17px;font-weight:600;line-height:1.55;white-space:pre-wrap}
.opts{display:flex;flex-direction:column;gap:10px}
.opt{display:flex;align-items:center;gap:14px;background:rgba(255,255,255,.04);border:1px solid var(--gb);color:var(--text);padding:14px 18px;border-radius:var(--rs);text-align:left;font-size:14px;width:100%}
.opt:hover:not(:disabled){background:rgba(124,109,250,.1);border-color:rgba(124,109,250,.4);transform:translateX(4px)}
.opt.sel{background:rgba(124,109,250,.2);border-color:var(--a1);color:#fff}
.opt.faded{opacity:.4}
.opt-l{width:28px;height:28px;display:flex;align-items:center;justify-content:center;background:rgba(124,109,250,.2);border-radius:7px;font-size:12px;font-weight:800;color:var(--a1);flex-shrink:0}
.opt.sel .opt-l{background:var(--a1);color:#fff}
.test-ready{max-width:700px;margin:0 auto;padding:40px 20px}
.intro{padding:36px;display:flex;flex-direction:column;gap:16px}
.intro h2{font-size:22px;font-weight:700}
.rules{list-style:none;display:flex;flex-direction:column;gap:10px}
.rules li{font-size:14px;color:var(--muted);padding:10px 14px;background:rgba(255,255,255,.03);border-radius:var(--rs)}
.result-pg{min-height:80vh;display:flex;align-items:center;justify-content:center;padding:20px}
.res-card{padding:40px;max-width:460px;width:100%;text-align:center;display:flex;flex-direction:column;align-items:center;gap:16px}
.res-emoji{font-size:56px}
.res-title{font-size:24px;font-weight:800}
.res-ring{width:120px;height:120px;border-radius:50%;display:flex;align-items:center;justify-content:center;position:relative}
.res-ring::before{content:'';position:absolute;inset:10px;background:var(--bg2);border-radius:50%}
.res-num{position:relative;font-size:26px;font-weight:800}
.res-stats{display:flex;gap:20px}
.res-stat{display:flex;flex-direction:column;align-items:center;gap:4px}
.res-stat span{font-size:12px;color:var(--muted)}
.res-stat strong{font-size:20px;font-weight:800}
.banned-pg{display:flex;align-items:center;justify-content:center;min-height:90vh;padding:20px}
.banned-card{max-width:440px;width:100%;padding:48px 40px;text-align:center;display:flex;flex-direction:column;align-items:center;gap:16px}
.banned-icon{font-size:64px}
.ban-title{font-size:26px;font-weight:800;color:var(--danger)}
.ban-reason{font-size:15px;padding:12px 16px;background:rgba(255,77,109,.1);border-radius:var(--rs);width:100%}
.pw{max-width:720px;margin:40px auto;padding:0 20px;display:flex;flex-direction:column;gap:16px}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.5}}
::-webkit-scrollbar{width:6px}
::-webkit-scrollbar-thumb{background:rgba(124,109,250,.3);border-radius:3px}
</style>
</head>
<body>

<nav class="nav" id="navbar" style="display:none">
  <div class="nav-brand" onclick="goto('/dashboard')">🐍 <span class="grad">PyLearn</span></div>
  <div class="nav-r">
    <div class="pts-badge" id="nav-pts">⚡ 0 ball</div>
    <img class="nav-img" id="nav-avatar" src="" alt="" style="display:none"/>
    <span style="font-size:13px;color:var(--muted)" id="nav-name"></span>
    <button class="btn-gh" onclick="logout()">Chiqish</button>
  </div>
</nav>

<div id="app"></div>

<script>
const API_URL = "https://GrogramUz.pythonanywhere.com/api";
const RECAPTCHA_SITE_KEY = "6LeGDa4sAAAAAGBtobleQY1SZpDnWp-V0TBlTeyo";

let STATE = {
  user:null, captchaToken:"", captchaDone:false,
  attemptId:null, questions:[], idx:0, answers:{}, selected:null,
  gTime:180, qTime:30, gTimer:null, qTimer:null, autoDone:false, submitting:false
};

async function apiFetch(method, path, body) {
  const token = localStorage.getItem("token");
  const opts = { method, headers:{"Content-Type":"application/json"}, credentials:"include" };
  if (token) opts.headers["Authorization"] = "Bearer " + token;
  if (body) opts.body = JSON.stringify(body);
  const res = await fetch(API_URL + path, opts);
  if (res.status === 401) { localStorage.removeItem("token"); goto("/"); return; }
  const data = await res.json();
  if (!res.ok) throw data;
  return data;
}

function goto(path) { history.pushState({}, "", path); route(); }
window.addEventListener("popstate", route);

function route() {
  const p = location.pathname;
  if (p === "/" || p === "/index.html") return renderLogin();
  if (p.startsWith("/auth/callback")) return renderAuthCallback();
  if (p === "/banned") return renderBanned();
  if (p === "/dashboard") return requireAuth(renderDashboard);
  if (p.startsWith("/lesson/")) return requireAuth(() => renderLesson(p.split("/")[2]));
  if (p.startsWith("/test/")) return requireAuth(() => renderTest(p.split("/")[2]));
  goto("/");
}

function requireAuth(fn) {
  if (!STATE.user) {
    showLoader();
    apiFetch("GET","/auth/me").then(u=>{ STATE.user=u; updateNav(); u.is_banned?goto("/banned"):fn(); }).catch(()=>goto("/"));
  } else { STATE.user.is_banned ? goto("/banned") : fn(); }
}

function app() { return document.getElementById("app"); }
function showLoader() { app().innerHTML='<div class="loader"><div class="spin"></div></div>'; }
function fmt(s) { return String(Math.floor(s/60)).padStart(2,"0")+":"+String(s%60).padStart(2,"0"); }

function updateNav() {
  const u = STATE.user;
  if (!u) { document.getElementById("navbar").style.display="none"; return; }
  document.getElementById("navbar").style.display="flex";
  document.getElementById("nav-pts").textContent="⚡ "+u.points+" ball";
  document.getElementById("nav-name").textContent=u.name.split(" ")[0];
  const av=document.getElementById("nav-avatar");
  if (u.avatar) { av.src=u.avatar; av.style.display="block"; }
}

function logout() { localStorage.removeItem("token"); STATE.user=null; document.getElementById("navbar").style.display="none"; goto("/"); }

// ── LOGIN ──
function renderLogin() {
  const urlErr = new URLSearchParams(location.search).get("error");
  let errMsg = urlErr==="captcha_required"?"CAPTCHA tasdiqlash talab qilinadi.":urlErr==="auth_failed"?"Google orqali kirish muvaffaqiyatsiz.":"";
  app().innerHTML=`
    <div class="login-page">
      <div class="login-card glass">
        <div class="login-logo">🐍</div>
        <h1 class="login-title grad">PyLearn</h1>
        <p class="login-sub">Python dasturlashni o'rganing — har kuni bir qadam</p>
        ${errMsg?`<div class="alert err">${errMsg}</div>`:""}
        <div class="cap-wrap"><div id="recaptcha-box"></div></div>
        <button class="btn-google" id="google-btn" onclick="handleGoogleLogin()" disabled>
          <svg width="20" height="20" viewBox="0 0 48 48">
            <path fill="#FFC107" d="M43.6 20.1H42V20H24v8h11.3C33.7 32.7 29.2 36 24 36c-6.6 0-12-5.4-12-12s5.4-12 12-12c3.1 0 5.8 1.1 7.9 3l5.7-5.7C34.5 6.5 29.5 4 24 4 12.9 4 4 12.9 4 24s8.9 20 20 20 20-8.9 20-20c0-1.3-.1-2.6-.4-3.9z"/>
            <path fill="#FF3D00" d="m6.3 14.7 6.6 4.8C14.7 16 19 13 24 13c3.1 0 5.8 1.1 7.9 3l5.7-5.7C34.5 6.5 29.5 4 24 4 16.3 4 9.7 8.3 6.3 14.7z"/>
            <path fill="#4CAF50" d="M24 44c5.2 0 9.9-2 13.4-5.2l-6.2-5.2C29.4 35.5 26.8 36 24 36c-5.2 0-9.6-3.3-11.3-8H6.4C9.8 35.7 16.3 44 24 44z"/>
            <path fill="#1976D2" d="M43.6 20.1H42V20H24v8h11.3c-.8 2.3-2.4 4.3-4.4 5.6l6.2 5.2C41.5 36.2 44 30.6 44 24c0-1.3-.1-2.6-.4-3.9z"/>
          </svg>
          Google orqali kirish
        </button>
        <div class="feats">
          <div class="feat">📚 Har kuni yangi dars</div>
          <div class="feat">⏱️ Vaqtli testlar</div>
          <div class="feat">🏆 Reyting tizimi</div>
        </div>
      </div>
    </div>`;
  STATE.captchaDone=false; STATE.captchaToken="";
  const iv=setInterval(()=>{
    const box=document.getElementById("recaptcha-box");
    if(box&&window.grecaptcha&&window.grecaptcha.render){
      clearInterval(iv);
      window.grecaptcha.render(box,{
        sitekey:RECAPTCHA_SITE_KEY,
        callback:onCaptcha,
        "expired-callback":()=>{ STATE.captchaDone=false; STATE.captchaToken=""; const b=document.getElementById("google-btn"); if(b)b.disabled=true; }
      });
    }
  },300);
}

async function onCaptcha(token) {
  try {
    const data=await apiFetch("POST","/auth/verify-captcha",{token});
    if(data.success){ STATE.captchaDone=true; STATE.captchaToken=data.captcha_token; const b=document.getElementById("google-btn"); if(b)b.disabled=false; }
  } catch(e) { alert("CAPTCHA xato. Qayta urinib ko'ring."); }
}

function handleGoogleLogin() {
  if(!STATE.captchaDone||!STATE.captchaToken) return;
  window.location.href=API_URL+"/auth/google?captcha_token="+encodeURIComponent(STATE.captchaToken);
}

// ── AUTH CALLBACK ──
function renderAuthCallback() {
  showLoader();
  const token=new URLSearchParams(location.search).get("token");
  if(!token){goto("/?error=auth_failed");return;}
  localStorage.setItem("token",token);
  apiFetch("GET","/auth/me").then(u=>{ STATE.user=u; updateNav(); goto("/dashboard"); }).catch(()=>goto("/?error=auth_failed"));
}

// ── DASHBOARD ──
async function renderDashboard() {
  showLoader();
  try {
    const [lessons,lb]=await Promise.all([apiFetch("GET","/lessons/"),apiFetch("GET","/user/leaderboard")]);
    const u=STATE.user;
    const done=lessons.filter(l=>l.is_completed).length;
    const pct=lessons.length?Math.round(done/lessons.length*100):0;
    app().innerHTML=`
      <div class="dash">
        <div class="dash-head glass">
          <div class="dash-welcome">
            ${u.avatar?`<img class="dash-av" src="${u.avatar}" alt="">`:""}
            <div><h2 style="font-size:20px;font-weight:700">Salom, ${u.name.split(" ")[0]}! 👋</h2><p style="color:var(--muted);font-size:13px">${u.email}</p></div>
          </div>
          <div class="dash-stats">
            <div class="stat"><span class="stat-v grad">${u.points}</span><span class="stat-l">⚡ Ball</span></div>
            <div class="stat"><span class="stat-v grad">${done}</span><span class="stat-l">📚 Dars</span></div>
            <div class="stat"><span class="stat-v grad">${pct}%</span><span class="stat-l">📈 Progress</span></div>
          </div>
        </div>
        <div class="prog-wrap">
          <div class="prog-bar"><div class="prog-fill" style="width:${pct}%"></div></div>
          <span class="prog-lbl">${done} / ${lessons.length} dars</span>
        </div>
        <div class="dash-main">
          <div>
            <div class="sec-title">📚 Darslar</div>
            <div class="lessons-list">
              ${lessons.map(l=>`
                <div class="lcard glass ${!l.is_unlocked?"locked":""} ${l.is_completed?"done":""}">
                  <div class="lday">Kun ${l.day_number}</div>
                  <div class="ltitle">${l.title}</div>
                  ${l.is_completed?`<div class="lscore">✅ ${l.score}%</div>`:""}
                  <div class="lact">
                    ${l.is_unlocked
                      ?`<button class="btn sm" onclick="goto('/lesson/${l.id}')">📖 O'qish</button>${!l.is_completed?`<button class="btn-ac sm" onclick="goto('/test/${l.id}')">🎯 Test</button>`:""}`
                      :`<span style="font-size:12px;color:var(--muted)">🔒 Qulflangan</span>`}
                  </div>
                </div>`).join("")}
            </div>
          </div>
          <div class="lb glass">
            <div class="sec-title">🏆 Reyting</div>
            ${lb.map(r=>`
              <div class="lb-row ${u.email===r.email?"lb-me":""}">
                <span class="lb-rank">${r.rank===1?"🥇":r.rank===2?"🥈":r.rank===3?"🥉":"#"+r.rank}</span>
                ${r.avatar?`<img class="lb-av" src="${r.avatar}" alt="">`:""}
                <span class="lb-name">${r.name}</span>
                <span class="lb-pts">⚡${r.points}</span>
              </div>`).join("")}
          </div>
        </div>
      </div>`;
  } catch(e) { app().innerHTML=`<div class="pw"><div class="alert err">Xatolik yuz berdi</div></div>`; }
}

// ── LESSON ──
async function renderLesson(id) {
  showLoader();
  try {
    const [lesson,status]=await Promise.all([apiFetch("GET","/lessons/"+id),apiFetch("GET","/tests/status/"+id)]);
    const html=marked.parse(lesson.content||"");
    let footer="";
    if(status.is_completed) footer=`<div class="alert suc">✅ Test topshirildi! Ball: ${status.attempt?.score}%</div>`;
    else if(status.can_start) footer=`<div class="test-cta"><p>Darsni o'qib chiqdingizmi?</p><button class="btn-ac" onclick="goto('/test/${lesson.id}')">🎯 Testni boshlash</button></div>`;
    else if(status.has_open_attempt) footer=`<div class="test-cta"><p>⚠️ Ochiq urinish bor!</p><button class="btn-ac" onclick="goto('/test/${lesson.id}')">▶️ Davom ettirish</button></div>`;
    else footer=`<div class="alert inf">ℹ️ Test hali ochilmagan.</div>`;
    app().innerHTML=`
      <div class="lesson-pg">
        <div class="lesson-hd glass">
          <button class="btn-gh" onclick="goto('/dashboard')">← Orqaga</button>
          <div><span class="badge">Kun ${lesson.day_number}</span><h1 style="font-size:20px;font-weight:700;margin-top:4px">${lesson.title}</h1></div>
        </div>
        <div class="lesson-body glass">${html}</div>
        <div class="lesson-ft glass">${footer}</div>
      </div>`;
  } catch(e) { app().innerHTML=`<div class="pw"><div class="alert err">${e.message||"Dars yuklanmadi"}</div><button class="btn" onclick="goto('/dashboard')">← Orqaga</button></div>`; }
}

// ── TEST ──
async function renderTest(lessonId) {
  showLoader();
  STATE.autoDone=false; STATE.submitting=false; STATE.answers={}; STATE.idx=0; STATE.selected=null;
  clearInterval(STATE.gTimer); clearInterval(STATE.qTimer);
  try {
    const s=await apiFetch("GET","/tests/status/"+lessonId);
    if(s.is_completed){showResult(s.attempt);return;}
    if(!s.can_start&&!s.has_open_attempt){
      app().innerHTML=`<div class="pw"><div class="alert err">Bu testni boshlab bo'lmaydi.</div><button class="btn" onclick="goto('/dashboard')">← Orqaga</button></div>`;
      return;
    }
    showTestReady(lessonId);
  } catch(e){ app().innerHTML=`<div class="pw"><div class="alert err">Xatolik</div><button class="btn" onclick="goto('/dashboard')">← Orqaga</button></div>`; }
}

function showTestReady(lessonId) {
  app().innerHTML=`
    <div class="test-ready">
      <div class="intro glass">
        <h2>🎯 Test qoidalari</h2>
        <ul class="rules">
          <li>⏱️ Umumiy vaqt: <strong>3 daqiqa</strong></li>
          <li>❓ Har savol uchun alohida vaqt bor</li>
          <li>🔴 Vaqt tugasa, test avtomatik topshiriladi</li>
          <li>🚫 3 daqiqadan oshsangiz — akkount ban qilinadi</li>
          <li>📅 Kuniga faqat 1 ta test</li>
        </ul>
        <button class="btn-ac" onclick="startTest(${lessonId})">▶️ Testni boshlash</button>
      </div>
    </div>`;
}

async function startTest(lessonId) {
  showLoader();
  try {
    const d=await apiFetch("POST","/tests/start/"+lessonId);
    STATE.attemptId=d.attempt_id; STATE.questions=d.questions;
    STATE.gTime=d.remaining_seconds; STATE.idx=0; STATE.answers={}; STATE.selected=null; STATE.autoDone=false;
    renderQuestion(); startGlobalTimer();
  } catch(e){
    if(e.error==="banned") goto("/banned");
    else app().innerHTML=`<div class="pw"><div class="alert err">${e.message||"Test boshlanmadi"}</div><button class="btn" onclick="goto('/dashboard')">← Orqaga</button></div>`;
  }
}

function renderQuestion() {
  clearInterval(STATE.qTimer); STATE.selected=null;
  const q=STATE.questions[STATE.idx];
  if(!q) return;
  STATE.qTime=q.time_limit_seconds;
  const L=["A","B","C","D"];
  app().innerHTML=`
    <div class="test-pg">
      <div class="test-top glass">
        <div style="font-size:14px;color:var(--muted);font-weight:600">Savol ${STATE.idx+1} / ${STATE.questions.length}</div>
        <div class="gtime ${STATE.gTime<=30?"danger":""}" id="gtime-el">⏱️ ${fmt(STATE.gTime)}</div>
      </div>
      <div class="tbar-w"><div class="tbar ${STATE.gTime<=30?"red":""}" id="tbar-el" style="width:${(STATE.gTime/180)*100}%"></div></div>
      <div class="qcard glass">
        <div class="qhd">
          <span class="qnum">#${STATE.idx+1}</span>
          <div class="qtimer ${STATE.qTime<=10?"danger":""}" id="qtimer-el">🕐 ${STATE.qTime}s</div>
        </div>
        <div class="qtbar-w"><div class="qtbar ${STATE.qTime<=10?"red":""}" id="qtbar-el" style="width:100%"></div></div>
        <p class="qtext">${q.question_text}</p>
        <div class="opts">
          ${q.options.map((opt,i)=>`
            <button class="opt" id="opt-${i}" onclick="selectOpt(${i})">
              <span class="opt-l">${L[i]}</span><span>${opt}</span>
            </button>`).join("")}
        </div>
        <div id="next-wrap"></div>
      </div>
    </div>`;
  startQTimer();
}

function selectOpt(i) {
  if(STATE.selected!==null) return;
  STATE.selected=i;
  STATE.answers[STATE.questions[STATE.idx].id]=i;
  document.querySelectorAll(".opt").forEach((el,idx)=>{
    if(idx===i) el.classList.add("sel"); else el.classList.add("faded");
    el.disabled=true;
  });
  const isLast=STATE.idx+1>=STATE.questions.length;
  document.getElementById("next-wrap").innerHTML=`
    <button class="btn-ac" style="align-self:flex-end;margin-top:8px" onclick="nextQuestion(false)">
      ${isLast?"✅ Testni tugatish":"Keyingi savol →"}
    </button>`;
}

function nextQuestion(timedOut) {
  clearInterval(STATE.qTimer); STATE.idx++;
  if(STATE.idx>=STATE.questions.length){
    if(!STATE.autoDone){STATE.autoDone=true; submitTest(timedOut&&STATE.gTime<=0);}
  } else { renderQuestion(); }
}

function startGlobalTimer() {
  clearInterval(STATE.gTimer);
  STATE.gTimer=setInterval(()=>{
    STATE.gTime--;
    const el=document.getElementById("gtime-el");
    const bar=document.getElementById("tbar-el");
    if(el){el.textContent="⏱️ "+fmt(STATE.gTime); if(STATE.gTime<=30)el.classList.add("danger");}
    if(bar){bar.style.width=(STATE.gTime/180*100)+"%"; if(STATE.gTime<=30)bar.classList.add("red");}
    if(STATE.gTime<=0){clearInterval(STATE.gTimer); if(!STATE.autoDone){STATE.autoDone=true;submitTest(true);}}
  },1000);
}

function startQTimer() {
  clearInterval(STATE.qTimer);
  STATE.qTimer=setInterval(()=>{
    STATE.qTime--;
    const el=document.getElementById("qtimer-el");
    const bar=document.getElementById("qtbar-el");
    const q=STATE.questions[STATE.idx];
    if(el){el.textContent="🕐 "+STATE.qTime+"s"; if(STATE.qTime<=10)el.classList.add("danger");}
    if(bar&&q){bar.style.width=(STATE.qTime/q.time_limit_seconds*100)+"%"; if(STATE.qTime<=10)bar.classList.add("red");}
    if(STATE.qTime<=0){clearInterval(STATE.qTimer); nextQuestion(true);}
  },1000);
}

async function submitTest(isTimeout) {
  if(STATE.submitting) return;
  STATE.submitting=true;
  clearInterval(STATE.gTimer); clearInterval(STATE.qTimer);
  showLoader();
  try {
    const d=await apiFetch("POST","/tests/submit/"+STATE.attemptId,{answers:STATE.answers,is_timed_out:isTimeout});
    apiFetch("GET","/auth/me").then(u=>{STATE.user=u;updateNav();});
    showResult(d);
  } catch(e){
    if(e.error==="banned") goto("/banned");
    else app().innerHTML=`<div class="pw"><div class="alert err">${e.message||"Topshirishda xato"}</div><button class="btn" onclick="goto('/dashboard')">← Orqaga</button></div>`;
  }
}

function showResult(result) {
  const pct=result.score??0;
  const pass=pct>=60;
  const correct=result.correct_answers_count??result.correct_count??0;
  const total=result.total_questions??0;
  const pts=result.points_earned;
  app().innerHTML=`
    <div class="result-pg">
      <div class="res-card glass">
        <div class="res-emoji">${pass?"🎉":"😔"}</div>
        <h2 class="res-title">${pass?"Tabriklaymiz!":"Keyingi safar urinib ko'ring"}</h2>
        <div class="res-ring" style="background:conic-gradient(var(--a1) ${pct}%,rgba(255,255,255,.08) 0)">
          <span class="res-num">${pct}%</span>
        </div>
        <div class="res-stats">
          <div class="res-stat"><span>✅ To'g'ri</span><strong>${correct}</strong></div>
          <div class="res-stat"><span>❓ Jami</span><strong>${total}</strong></div>
          ${pts!=null?`<div class="res-stat"><span>⚡ Ball</span><strong>+${pts}</strong></div>`:""}
        </div>
        ${result.is_timed_out?`<div class="alert war">⚠️ Vaqt tugaganligi sababli avtomatik topshirildi.</div>`:""}
        <button class="btn" onclick="goto('/dashboard')">🏠 Bosh sahifaga</button>
      </div>
    </div>`;
}

// ── BANNED ──
function renderBanned() {
  const u=STATE.user;
  app().innerHTML=`
    <div class="banned-pg">
      <div class="banned-card glass">
        <div class="banned-icon">🚫</div>
        <h1 class="ban-title">Akkount bloklandi</h1>
        <p class="ban-reason">${u?.ban_reason||"Qoidalar buzildi"}</p>
        <p style="font-size:13px;color:var(--muted)">Administrator bilan bog'laning.</p>
        <button class="btn-gh" onclick="logout()">Chiqish</button>
      </div>
    </div>`;
}

// ── INIT ──
const _token=localStorage.getItem("token");
if(_token&&!location.pathname.startsWith("/auth/callback")){
  apiFetch("GET","/auth/me").then(u=>{STATE.user=u;updateNav();route();}).catch(()=>{localStorage.removeItem("token");route();});
} else { route(); }
</script>
</body>
</html>
